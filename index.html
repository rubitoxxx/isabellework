<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Avaliação de Ansiedade e Depressão</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
  box-sizing: border-box;
}

body {
  font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  background: linear-gradient(135deg, #f2f4f7 0%, #e8ecf1 100%);
  padding: 20px;
  margin: 0;
  min-height: 100vh;
  line-height: 1.6;
}

.container {
  max-width: 900px;
  margin: auto;
  background: #fff;
  padding: 30px;
  border-radius: 12px;
  box-shadow: 0 4px 20px rgba(0,0,0,0.1);
}

h1 {
  text-align: center;
  color: #2c3e50;
  margin-bottom: 10px;
  font-size: 28px;
}

h2 {
  text-align: center;
  color: #34495e;
  margin-top: 30px;
  margin-bottom: 15px;
  font-size: 22px;
  padding-bottom: 10px;
  border-bottom: 2px solid #e0e0e0;
}

h3 {
  color: #2c3e50;
  margin-top: 0;
}

p {
  color: #555;
  margin-bottom: 15px;
}

label {
  font-weight: 600;
  color: #333;
  display: block;
  margin-bottom: 8px;
}

input[type="text"], input[type="tel"] {
  width: 100%;
  padding: 12px;
  margin-top: 5px;
  margin-bottom: 15px;
  border-radius: 6px;
  border: 2px solid #ddd;
  font-size: 15px;
  transition: border-color 0.3s ease;
}

input[type="text"]:focus, input[type="tel"]:focus {
  outline: none;
  border-color: #0066cc;
  box-shadow: 0 0 0 3px rgba(0, 102, 204, 0.1);
}

.question {
  margin-top: 25px;
  padding: 20px;
  background: #f8f9fa;
  border-radius: 8px;
  border-left: 4px solid #0066cc;
}

.question > label:first-child {
  font-size: 16px;
  color: #2c3e50;
  margin-bottom: 12px;
  display: block;
}

.question label {
  font-weight: normal;
  display: flex;
  align-items: center;
  margin: 10px 0;
  padding: 10px;
  border-radius: 5px;
  cursor: pointer;
  transition: background-color 0.2s ease;
}

.question label:hover {
  background-color: #e8f4f8;
}

.question input[type="radio"] {
  margin-right: 10px;
  width: 18px;
  height: 18px;
  cursor: pointer;
  accent-color: #0066cc;
}

hr {
  border: none;
  border-top: 2px solid #e0e0e0;
  margin: 30px 0;
}

button {
  margin-top: 30px;
  width: 100%;
  padding: 16px;
  font-size: 17px;
  font-weight: 600;
  background: #0066cc;
  color: white;
  border: none;
  border-radius: 8px;
  cursor: pointer;
  transition: all 0.3s ease;
  box-shadow: 0 2px 8px rgba(0, 102, 204, 0.3);
}

button:hover {
  background: #0052a3;
  transform: translateY(-2px);
  box-shadow: 0 4px 12px rgba(0, 102, 204, 0.4);
}

button:active {
  transform: translateY(0);
}

.resultado {
  margin-top: 30px;
  background: linear-gradient(135deg, #eef6ff 0%, #e0f0ff 100%);
  padding: 25px;
  border-radius: 8px;
  border-left: 5px solid #0066cc;
  animation: fadeIn 0.5s ease;
}

@keyframes fadeIn {
  from {
    opacity: 0;
    transform: translateY(-10px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.resultado p {
  margin: 12px 0;
  font-size: 16px;
}

.resultado strong {
  color: #2c3e50;
}

.alerta {
  color: #d32f2f;
  font-weight: bold;
  background: #ffebee;
  padding: 15px;
  border-radius: 6px;
  border-left: 4px solid #d32f2f;
  margin: 15px 0;
}

.resultado em {
  color: #666;
  font-size: 14px;
  display: block;
  margin-top: 15px;
  padding-top: 15px;
  border-top: 1px solid #ddd;
}

@media (max-width: 768px) {
  body {
    padding: 10px;
  }
  
  .container {
    padding: 20px;
  }
  
  h1 {
    font-size: 24px;
  }
  
  h2 {
    font-size: 20px;
  }
  
  .question {
    padding: 15px;
  }
}
</style>
</head>

<body>

<div class="container">
<h1>Avaliação de Saúde Mental</h1>

<form id="formulario">

<label>Nome do Usuário</label>
<input type="text" id="nome" required>

<label>Celular</label>
<input type="tel" id="celular" required>

<hr>

<h2>GAD-7 – Ansiedade</h2>
<p>Nas últimas duas semanas, com que frequência você foi incomodado pelos seguintes problemas?</p>

<div id="gad7"></div>

<hr>

<h2>PHQ-9 – Depressão</h2>
<p>Nas últimas duas semanas, com que frequência você foi incomodado pelos seguintes problemas?</p>

<div id="phq9"></div>

<button type="submit">Calcular Resultado</button>
</form>

<div id="resultado" class="resultado" style="display:none;"></div>
</div>

<script>
const opcoes = [
  {texto:"De jeito nenhum", valor:0},
  {texto:"Vários dias", valor:1},
  {texto:"Mais da metade dos dias", valor:2},
  {texto:"Quase todos os dias", valor:3}
];

const gad7Perguntas = [
"Sentir-se nervoso, ansioso ou tenso",
"Não conseguir parar ou controlar a preocupação",
"Preocupar-se demais com coisas diferentes",
"Dificuldade em relaxar",
"Tão inquieto que é difícil ficar parado",
"Ficar irritado ou aborrecido com facilidade",
"Sentir medo, como se algo terrível pudesse acontecer"
];

const phq9Perguntas = [
"Pouco interesse ou prazer em fazer coisas",
"Sentindo-se triste, deprimido ou sem esperança",
"Dificuldade em adormecer, manter o sono ou dormir demais",
"Sentir-se cansado ou com pouca energia",
"Falta de apetite ou comer em excesso",
"Sentir-se mal consigo mesmo ou achar que é um fracasso",
"Dificuldade de concentração",
"Mover-se ou falar devagar demais ou agitação excessiva",
"Pensamentos de que estaria melhor morto ou de se machucar"
];

function gerarQuestoes(lista, containerId, prefixo){
  const container = document.getElementById(containerId);
  lista.forEach((pergunta, i)=>{
    let html = `<div class="question"><label>${i+1}. ${pergunta}</label>`;
    opcoes.forEach(op=>{
      html += `
      <label>
        <input type="radio" name="${prefixo}${i}" value="${op.valor}" required>
        ${op.texto}
      </label>`;
    });
    html += "</div>";
    container.innerHTML += html;
  });
}

gerarQuestoes(gad7Perguntas,"gad7","g");
gerarQuestoes(phq9Perguntas,"phq9","p");

document.getElementById("formulario").addEventListener("submit", function(e){
  e.preventDefault();

  let gadScore = 0;
  let phqScore = 0;
  let riscoSuicidio = false;

  gad7Perguntas.forEach((_,i)=>{
    gadScore += Number(document.querySelector(`input[name="g${i}"]:checked`).value);
  });

  phq9Perguntas.forEach((_,i)=>{
    const val = Number(document.querySelector(`input[name="p${i}"]:checked`).value);
    phqScore += val;
    if(i === 8 && val > 0) riscoSuicidio = true;
  });

  function interpretacaoGAD(score){
    if(score <= 4) return "Ansiedade mínima";
    if(score <= 9) return "Ansiedade leve";
    if(score <= 14) return "Ansiedade moderada";
    return "Ansiedade grave";
  }

  function interpretacaoPHQ(score){
    if(score <= 4) return "Nenhum ou mínimo";
    if(score <= 9) return "Depressão leve";
    if(score <= 14) return "Depressão moderada";
    if(score <= 19) return "Depressão moderadamente grave";
    return "Depressão grave";
  }

  document.getElementById("resultado").style.display = "block";
  document.getElementById("resultado").innerHTML = `
    <h3>Resultado</h3>
    <p><strong>GAD-7:</strong> ${gadScore} pontos – ${interpretacaoGAD(gadScore)}</p>
    <p><strong>PHQ-9:</strong> ${phqScore} pontos – ${interpretacaoPHQ(phqScore)}</p>
    ${riscoSuicidio ? '<p class="alerta">⚠ Atenção: resposta positiva na questão 9 do PHQ-9. Avaliação profissional imediata é recomendada.</p>' : ''}
    <hr>
    <p><em>Este questionário é uma ferramenta de triagem e não substitui avaliação clínica profissional.</em></p>
  `;
});
</script>

</body>
</html>
